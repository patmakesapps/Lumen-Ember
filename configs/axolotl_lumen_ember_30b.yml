# Lumen-Ember-30B — Axolotl QLoRA config
#
# ⚠️ UNTESTED AND CURRENTLY UNUSABLE.
#
# Axolotl does not support `muse_glimmer` as of 2026-08-11. Its supported-model
# list tops out at Shieldstral (2026/08), Mistral Medium 3.5, Gemma 4, Qwen3.5
# and GLM-4.x — Muse Glimmer is absent, and the architecture
# (`MuseGlimmerForConditionalGeneration`) is a new multimodal class released
# 2026-08-10.
#
# The working path is `configs/train_unsloth.py`, which uses Unsloth's day-0
# Muse Glimmer support. This file exists so that when Axolotl support lands the
# config is already written and reviewed; it is NOT a fallback you can run today.
#
# Before trusting it, verify:
#   1. `muse_glimmer` appears in Axolotl's supported architectures
#   2. the chat template renders tool calls (ATEM) via the `chat_template` field
#   3. `tools` survive the dataset loader — our rows carry a `tools` array that
#      must reach `apply_chat_template(..., tools=...)`, not be dropped
#
# Rationale for every value mirrors configs/train_unsloth.py; see the comments
# there, they are the authority.

base_model: meta-models/Muse-Glimmer-30B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

# 4-bit base. ~60 GB bf16 -> ~18-20 GB quantised, leaving an 80 GB card room
# for activations at seq len 8192.
load_in_4bit: true
adapter: qlora

datasets:
  - path: data/final/train.jsonl
    type: chat_template
    chat_template: tokenizer_default   # Glimmer's Onyx ATEM template
    field_messages: messages
    message_field_role: role
    message_field_content: content
test_datasets:
  - path: data/final/val.jsonl
    type: chat_template
    chat_template: tokenizer_default
    field_messages: messages
    split: train

dataset_prepared_path: outputs/prepared
output_dir: outputs/Lumen-Ember-30B

# Measured on data/final/train.jsonl: median 2,350 tok, p90 5,049, max 17,702.
# 8192 keeps 93.8% of rows intact; 4096 truncates 14.5%, and truncation on an
# agent transcript usually removes the final report — the tokens that teach
# honest completion.
sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

# r=32 / alpha=64 (2:1). Attention AND MLP: the target behaviour is a
# disposition (refuse when unattended), not a surface format, and MLP is where
# routing lives. Cheap at r=32.
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Loss on assistant tokens only. The system preamble is ~17.5k tokens of tool
# schemas that never vary; training on it spends gradient reproducing an
# invariant block. See docs/FINDINGS.md §1.3.
train_on_inputs: false

num_epochs: 2                 # ~1k unique rows; 3+ starts memorising
learning_rate: 0.0001         # standard QLoRA band for r=32
lr_scheduler: cosine
warmup_ratio: 0.03
micro_batch_size: 1
gradient_accumulation_steps: 16   # effective batch 16
optimizer: adamw_8bit
weight_decay: 0.01
max_grad_norm: 1.0

bf16: auto
tf32: true
gradient_checkpointing: true
flash_attention: true

logging_steps: 5
evals_per_epoch: 4
saves_per_epoch: 2
save_total_limit: 3
seed: 20260811

special_tokens:
  pad_token: "<|finetune_right_pad|>"
